<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando Registro - Cash no Pix</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --dark-bg: #0a0a0a;
            --surface: #111;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: var(--surface);
            padding: 3rem 2rem;
            border-radius: 20px;
            border: 1px solid rgba(57, 255, 20, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .icon-check {
            width: 60px;
            height: 60px;
            background: rgba(57, 255, 20, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 30px;
            box-shadow: 0 0 15px var(--neon-green);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Container da Barra */
        .progress-container {
            background: #222;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            position: relative;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        /* Barra de Cor */
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #1f850b, var(--neon-green));
            width: 0%; /* Iniciado via JS */
            box-shadow: 0 0 15px var(--neon-green);
            transition: width 1s linear;
        }

        #timer {
            font-family: 'Courier New', Courier, monospace;
            color: var(--neon-green);
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(57, 255, 20, 0.1);
            color: var(--neon-green);
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 2rem;
            border: 1px solid rgba(57, 255, 20, 0.2);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-check">✓</div>
    <h1>Parabéns!</h1>
    <p>Seu registro do Pix foi enviado com sucesso para o financeiro. O prazo para a conclusão é de até <b>1 horas</b>.</p>

    <div class="progress-container">
        <div class="progress-bar" id="bar"></div>
    </div>
    
    <div id="timer">01:00:00</div>

    <div class="status-badge">Análise de Segurança em curso</div>
    
    <p style="font-size: 0.8rem; margin-top: 1.5rem; color: #555;">
        Você será notificado assim que o cadastro for concluído. <br>
        Pode fecha essa aba e aguardar!.
    </p>
</div>

<script>
    // Configuração: 2 horas em segundos
    let totalTime = 2 * 60 * 60; 
    let currentTime = totalTime;

    const bar = document.getElementById('bar');
    const timerDisplay = document.getElementById('timer');

    function updateProgress() {
        if (currentTime <= 0) {
            clearInterval(interval);
            timerDisplay.innerHTML = "CONCLUÍDO";
            bar.style.width = "100%";
            return;
        }

        currentTime--;

        // Cálculo da porcentagem
        const percent = ((totalTime - currentTime) / totalTime) * 100;
        bar.style.width = percent + "%";

        // Formatação do Timer (HH:MM:SS)
        let hrs = Math.floor(currentTime / 3600);
        let mins = Math.floor((currentTime % 3600) / 60);
        let secs = currentTime % 60;

        timerDisplay.innerHTML = 
            (hrs < 10 ? "0" + hrs : hrs) + ":" + 
            (mins < 10 ? "0" + mins : mins) + ":" + 
            (secs < 10 ? "0" + secs : secs);
    }

    // Atualiza a cada segundo
    const interval = setInterval(updateProgress, 1000);
</script>

</body>

</html>
