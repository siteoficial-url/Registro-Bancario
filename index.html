<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Bancário - Cash no Pix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #121212;
            border: 1px solid #1f1f1f;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 102, 0.05);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00ff66, #00b347);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .logo-area h1 span {
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .logo-area p {
            font-size: 13px;
            color: #888888;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cccccc;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
            background: #1a1a1a;
        }

        .error-message {
            font-size: 11px;
            color: #ff4d4d;
            margin-top: 4px;
            display: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #00ff66;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.2);
        }

        .btn-submit:hover {
            background: #00cc52;
            box-shadow: 0 6px 20px rgba(0, 255, 102, 0.4);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Success Screen */
        .success-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: rgba(0, 255, 102, 0.1);
            border: 2px solid #00ff66;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            color: #00ff66;
            font-size: 32px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }

        .success-screen h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .success-screen p {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-support {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-support:hover {
            background: rgba(0, 255, 102, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Formulário de Cadastro -->
        <div id="form-container">
            <div class="logo-area">
                <h1>CASH NO <span>PIX</span></h1>
                <p>Preencha os dados bancários com segurança</p>
            </div>

            <form id="registroForm" novalidate>
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                    <div class="error-message" id="error-nome">Insira seu nome e sobrenome.</div>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                    <div class="error-message" id="error-email">Insira um e-mail válido.</div>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                    <div class="error-message" id="error-cpf">CPF inválido. Verifique os números.</div>
                </div>

                <div class="form-group">
                    <label for="chavePix">Chave Pix</label>
                    <input type="text" id="chavePix" placeholder="CPF, E-mail, Telefone ou Chave Aleatória" required>
                    <div class="error-message" id="error-chavePix">Insira uma chave Pix válida.</div>
                </div>

                <button type="submit" class="btn-submit">Continuar</button>
            </form>
        </div>

        <!-- Tela de Sucesso -->
        <div id="success-container" class="success-screen">
            <div class="success-icon">✓</div>
            <h2>Seu registro está Salvo!</h2>
            <p>Seus dados foram validados e salvos com sucesso no sistema.</p>
            <a href="#" class="btn-support" onclick="voltarSuporte(event)">Voltar para o suporte</a>
        </div>
    </div>

    <script>
        // Máscara e Validação de CPF
        const cpfInput = document.getElementById('cpf');
        cpfInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            
            if (value.length > 9) {
                value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                value = value.replace(/^(\d{3})(\d{3})(\d{3}).*/, '$1.$2.$3');
            } else if (value.length > 3) {
                value = value.replace(/^(\d{3})(\d{3}).*/, '$1.$2');
            }
            e.target.value = value;
        });

        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            
            let soma = 0;
            for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
            let resto = 11 - (soma % 11);
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf.charAt(9))) return false;
            
            soma = 0;
            for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
            resto = 11 - (soma % 11);
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf.charAt(10))) return false;
            
            return true;
        }

        // Validação do Formulário ao Enviar
        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;

            // Elementos
            const nome = document.getElementById('nome');
            const email = document.getElementById('email');
            const cpf = document.getElementById('cpf');
            const chavePix = document.getElementById('chavePix');

            const errNome = document.getElementById('error-nome');
            const errEmail = document.getElementById('error-email');
            const errCpf = document.getElementById('error-cpf');
            const errChave = document.getElementById('error-chavePix');

            // Validação Nome (mínimo de 2 palavras e 5 caracteres)
            const nomeVal = nome.value.trim();
            if (nomeVal.split(' ').length < 2 || nomeVal.length < 5) {
                errNome.style.display = 'block';
                nome.style.borderColor = '#ff4d4d';
                isValid = false;
            } else {
                errNome.style.display = 'none';
                nome.style.borderColor = '#2a2a2a';
            }

            // Validação E-mail
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.value.trim())) {
                errEmail.style.display = 'block';
                email.style.borderColor = '#ff4d4d';
                isValid = false;
            } else {
                errEmail.style.display = 'none';
                email.style.borderColor = '#2a2a2a';
            }

            // Validação CPF (Algoritmo Real)
            if (!validarCPF(cpf.value)) {
                errCpf.style.display = 'block';
                cpf.style.borderColor = '#ff4d4d';
                isValid = false;
            } else {
                errCpf.style.display = 'none';
                cpf.style.borderColor = '#2a2a2a';
            }

            // Validação Chave Pix (mínimo 5 caracteres)
            if (chavePix.value.trim().length < 5) {
                errChave.style.display = 'block';
                chavePix.style.borderColor = '#ff4d4d';
                isValid = false;
            } else {
                errChave.style.display = 'none';
                chavePix.style.borderColor = '#2a2a2a';
            }

            // Se tudo estiver correto, avança para a tela de sucesso
            if (isValid) {
                document.getElementById('form-container').style.display = 'none';
                document.getElementById('success-container').style.display = 'block';
            }
        });

        function voltarSuporte(e) {
            e.preventDefault();
            alert("Redirecionando de volta para o suporte...");
            // Aqui você pode colocar o redirecionamento real, ex: window.location.href = "link-do-suporte";
        }
    </script>
</body>
</html>
